plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ondeviceai'
version = '0.1.0'

android {
  namespace "expo.modules.ondeviceai"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Gemini Nano on-device (AICore). Disponibile solo sui dispositivi supportati.
  // beta3/beta4 sono compilate con Kotlin 2.3, che il compilatore Kotlin 2.1 di React Native
  // non sa leggere: beta2 (metadati 2.2) ha la stessa API usata qui.
  implementation "com.google.mlkit:genai-prompt:1.0.0-beta2"
}
