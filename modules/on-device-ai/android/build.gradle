plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ondeviceai'
version = '0.1.0'

android {
  namespace "expo.modules.ondeviceai"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Gemini Nano on-device (AICore). Disponibile solo sui dispositivi supportati.
  implementation "com.google.mlkit:genai-prompt:1.0.0-beta4"
}
